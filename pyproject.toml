[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionshield"
version = "0.1.0"
description = "Privacy-conscious RGB and thermal evidence fusion for edge monitoring."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "VISIONSHIELD contributors" }]
dependencies = []

[project.optional-dependencies]
ai = ["ultralytics>=8.3,<9", "opencv-python-headless>=4.10,<5", "numpy>=1.26,<3"]
web = ["flask>=3.0,<4"]
dev = ["pytest>=8,<9"]

[project.scripts]
visionshield = "visionshield.cli:main"
visionshield-ui = "visionshield.server:main"
visionshield-hardware = "visionshield.hardware_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
