[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionshield"
version = "0.1.0"
description = "Privacy-conscious RGB and thermal evidence fusion for edge monitoring."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "VISIONSHIELD contributors" }]
dependencies = []

[project.scripts]
visionshield = "visionshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
